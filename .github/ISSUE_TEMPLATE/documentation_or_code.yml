name: Documentation or code issue
description: Report a problem in the documentation, examples, notebooks, or Earth Engine scripts.
title: "[Docs/Code]: "
labels:
  - documentation
body:
  - type: input
    id: file
    attributes:
      label: Affected file or page
      placeholder: "For example: data_access/gee_clip_and_export.js"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe what is unclear, incorrect, or failing.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior or suggested change
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and reproduction
      description: For code issues, include the command, software version, and complete error message.
